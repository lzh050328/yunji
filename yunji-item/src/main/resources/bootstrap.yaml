spring:
  application:
    name: item-service
  profiles:
    active: dev
  cloud:
    nacos:
      # 配置中心：读取共享配置（Redis 连接信息，Redisson 与缓存都依赖它）
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        shared-configs:
          - data-id: shared-redis.yaml
            group: DEFAULT_GROUP
            refresh: true
      # 服务注册：保持默认 public 命名空间，与其他微服务同空间
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
