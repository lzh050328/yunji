server:
  port: 8082
feign:
  sentinel:
    enabled: true # 开启 feign 对 sentinel 的支持（同步执行，不切换线程）
spring:
  application:
    name: cart-service
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}  # nacos服务地址
      username: nacos # 用户名
      password: ${NACOS_PASSWORD:} # 密码
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      http-method-specify: true # 开启请求方式前缀可根据http请求方法区分簇点链路
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${hm.db.host}:3306/hm-cart?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
  mapper-locations: classpath*:mapper/*.xml
logging:
  level:
    com.hmall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 云集商城购物车服务接口文档
    description: "云集商城购物车服务接口文档"
    email: ""
    concat: 云集商城
    url: ""
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.hmall.cart.controller
