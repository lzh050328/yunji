spring:
  application:
    name: gateway
  profiles:
    active: dev
  cloud:
    nacos:
      # 配置中心：使用独立命名空间，业务配置全部托管在此
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      # 服务注册：保持默认 public 命名空间，才能发现其他微服务
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
